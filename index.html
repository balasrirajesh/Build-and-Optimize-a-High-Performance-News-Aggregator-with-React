<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackerPulse — Top Hacker News Stories, Live</title>
    <meta name="description" content="HackerPulse aggregates the top 500 stories from Hacker News in real-time. Filter, sort, and explore the most upvoted tech news and discussions." />

    <!-- Preconnect to Google Fonts for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter font with variable weight range -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Preload hero image as it's the LCP element -->
    <link rel="preload" href="/hero-optimized.png" as="image" />

    <!-- Open Graph -->
    <meta property="og:title" content="HackerPulse — Top Hacker News Stories, Live" />
    <meta property="og:description" content="Aggregates the top 500 stories from Hacker News in real-time." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
